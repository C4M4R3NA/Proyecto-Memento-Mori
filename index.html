<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Joyería</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .catalogo { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .producto { background: white; border: 1px solid #ddd; padding: 15px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .producto img { width: 100%; height: auto; border-radius: 4px; }
        .precio { font-weight: bold; color: #27ae60; margin: 10px 0; }
        .btn { background-color: #3498db; color: white; padding: 8px 12px; text-decoration: none; border-radius: 4px; display: inline-block; }
    </style>
</head>
<body>

    <h1>Catálogo de Joyería</h1>

    <div class="catalogo">
        <div class="producto">
            <h3>Cadena de Plata</h3>
            <p class="precio">$450 MXN</p>
            <a href="#" class="btn">Pedir por WhatsApp</a>
        </div>
        <div class="producto">
            <h3>Anillo Ajustable</h3>
            <p class="precio">$300 MXN</p>
            <a href="#" class="btn">Pedir por WhatsApp</a>
        </div>
        <div class="producto">
            <h3>Pulsera Tejida</h3>
            <p class="precio">$250 MXN</p>
            <a href="#" class="btn">Pedir por WhatsApp</a>
        </div>
    </div>

</body>
</html>
